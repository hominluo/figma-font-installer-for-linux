[package]
name = "figma-font-agent"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "Serve Linux system fonts to Figma in the browser"
license = "MIT"
readme = "README.md"
repository = "https://github.com/hominluo/figma-font-installer-for-linux"
homepage = "https://github.com/hominluo/figma-font-installer-for-linux"
documentation = "https://github.com/hominluo/figma-font-installer-for-linux/blob/main/docs/protocol.md"
keywords = ["figma", "fonts", "linux", "fontconfig"]
categories = ["command-line-utilities"]

[[bin]]
name = "figma-font-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
ttf-parser = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Homin Luo <homin.ro@gmail.com>"
copyright = "2026, Homin Luo"
license-file = ["LICENSE"]
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "fontconfig"
extended-description = """An open reimplementation of the local font protocol used by the Figma \
Agent, which Figma ships only for macOS and Windows. This service lets the \
browser build of Figma list and render the fonts installed on a Linux machine. Fonts are discovered through fontconfig, font \
previews are rendered as SVG, and the service is restricted to 127.0.0.1."""
assets = [
    ["target/release/figma-font-agent", "usr/bin/", "755"],
    ["packaging/figma-font-agent.service", "usr/lib/systemd/user/", "644"],
    ["packaging/figma-font-agent.socket", "usr/lib/systemd/user/", "644"],
    ["docs/figma-font-agent.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/figma-font-agent/README.md", "644"],
    ["LICENSE", "usr/share/doc/figma-font-agent/copyright", "644"],
]

[package.metadata.generate-rpm]
# The binary is static; there is nothing for an automatic dependency scan to find.
auto-req = "no"
assets = [
    { source = "target/release/figma-font-agent", dest = "/usr/bin/figma-font-agent", mode = "755" },
    { source = "packaging/figma-font-agent.service", dest = "/usr/lib/systemd/user/figma-font-agent.service", mode = "644" },
    { source = "packaging/figma-font-agent.socket", dest = "/usr/lib/systemd/user/figma-font-agent.socket", mode = "644" },
    { source = "docs/figma-font-agent.1", dest = "/usr/share/man/man1/figma-font-agent.1", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/figma-font-agent/README.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/figma-font-agent/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.recommends]
fontconfig = "*"
