[package]
name = "figma-font-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Serve Linux system fonts to Figma in the browser (open reimplementation of Figma's local font agent protocol)"
license = "MIT"
repository = "https://github.com/hominluo/figma-font-installer-for-linux"
keywords = ["figma", "fonts", "linux", "fontconfig"]
categories = ["command-line-utilities"]

[[bin]]
name = "figma-font-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs"] }
ttf-parser = "0.25"

[profile.release]
lto = true
codegen-units = 1
strip = true
